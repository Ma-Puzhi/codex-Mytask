<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打开任务会话</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#182033;background:#f6f8fc}*{box-sizing:border-box}body{margin:0;padding:50px 18px}main{max-width:570px;margin:auto;padding:28px;border:1px solid #e6eaf1;border-radius:16px;background:#fff}h1{font-size:22px;margin:0 0 14px}p{line-height:1.65;font-size:14px;color:#69768c}button,a.button{display:inline-flex;align-items:center;justify-content:center;border:1px solid #d9dfeb;border-radius:10px;padding:10px 16px;background:#246bfd;color:#fff;text-decoration:none;font:inherit;cursor:pointer}.secondary{background:transparent!important;color:inherit!important}textarea,input{width:100%;border:1px solid #d9dfeb;border-radius:9px;padding:10px;font:inherit;margin:10px 0}textarea{height:190px;font-size:12px}details{margin-top:20px}summary{cursor:pointer;font-size:14px}#fallback,#error{display:none}#status[role=alert]{color:#ba2637}@media(prefers-color-scheme:dark){:root{color:#f0f4fb;background:#11151d}main{background:#181e28;border-color:#293241}p{color:#a2adc0}}
</style></head><body><main><h1 id="title">正在打开任务会话</h1><p id="status" role="status">正在读取这个任务的绑定…</p><div id="error"><button id="retry" class="secondary">重试</button></div>
<div id="fallback"><p>安装一次辅助扩展后，这里会自动新建、绑定并打开会话。</p><a class="button" href="/downloads/MyTasks_Chat_Bridge.zip">下载辅助扩展</a><p>Chrome / Edge：解压下载文件，在扩展管理页开启“开发者模式”，点击“加载已解压的扩展程序”，选择解压后的文件夹。安装后点击重试。</p><button class="secondary" id="installed">已安装，重试</button><details><summary>暂时手动打开并绑定</summary><p>复制下方任务上下文，在打开的会话里粘贴并发送。首次发送后，复制该会话地址，在这里保存。之后会打开同一个会话。</p><a class="button" id="manual-open" target="_blank" rel="noopener noreferrer">打开会话</a><textarea readonly id="prompt" aria-label="任务上下文"></textarea><input id="manual-url" type="url" placeholder="https://chatgpt.com/c/…" aria-label="会话地址"><button id="manual-bind">保存绑定</button></details></div></main>
<script>
const $=s=>document.querySelector(s),nonce=crypto.randomUUID();let payload=null,originalUrl='',saving=false;
const args=new URLSearchParams(location.search),id=args.get('id'),mode=args.get('mode');
const status=text=>{$('#status').textContent=text};
async function api(name,body){const r=await fetch('/api/tool/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const out=await r.json();if(!r.ok||out.isError)throw new Error(out.error||out.content?.[0]?.text||'操作失败');return out.structuredContent}
function deepLink(url){if(url)return url;const u=new URL('https://chatgpt.com/');u.searchParams.set('surface',mode==='work'?'work':'chat');return u.href}
function closeLauncher(){status('已打开任务会话，正在关闭此页…');window.postMessage({channel:'mytasks-companion',type:'saved',nonce},location.origin);setTimeout(()=>window.close(),400)}
async function bind(url){if(saving)return;saving=true;try{if(!payload.url||url!==payload.url)await api('set_task_ai_workspace',{id,mode,url,title:payload.title});closeLauncher()}catch(e){status('会话已打开，但绑定保存失败：'+e.message+'。请保留本页并重试。');saving=false;$('#error').style.display='block'}}
window.addEventListener('message',event=>{if(event.source!==window||event.origin!==location.origin)return;const m=event.data;if(m?.channel!=='mytasks-companion'||m.nonce!==nonce)return;if(m.type==='state'){if(m.state==='bound'){bind(m.url)}else if(m.state==='error'){status(m.message||'暂时无法打开会话');$('#error').style.display='block'}else status(m.message||'正在打开 ChatGPT…')}});
async function hasHelper(){return new Promise(resolve=>{let finished=false;const done=value=>{if(finished)return;finished=true;clearInterval(timer);clearTimeout(timeout);window.removeEventListener('message',listener);resolve(value)};const listener=e=>{if(e.source===window&&e.origin===location.origin&&e.data?.channel==='mytasks-companion'&&e.data.type==='pong'&&e.data.nonce===nonce)done(true)};window.addEventListener('message',listener);const ping=()=>window.postMessage({channel:'mytasks-companion',type:'ping',nonce},location.origin);const timer=setInterval(ping,150),timeout=setTimeout(()=>done(false),2500);ping()})}
async function start(){try{
 if(!id||!['chat','work'].includes(mode))throw new Error('任务或模式无效');
 payload=await api('get_task_launch',{id,mode});originalUrl=payload.url;
 $('#title').textContent=payload.title+' · '+(mode==='work'?'Work':'聊天');
 if(await hasHelper()){status('正在打开 '+(payload.url?'已绑定会话':'新会话')+'…');window.postMessage({channel:'mytasks-companion',type:'start',nonce,payload:{...payload,forceNew:args.get('new')==='1'}},location.origin)}
 else{status('辅助扩展尚未启用');$('#fallback').style.display='block';$('#manual-open').href=deepLink(args.get('new')==='1'?'':originalUrl);$('#prompt').value=payload.prompt||payload.newPrompt}
 }catch(e){status(e.message);$('#status').setAttribute('role','alert');$('#error').style.display='block'}}
$('#retry').onclick=$('#installed').onclick=()=>location.reload();
$('#manual-bind').onclick=()=>bind($('#manual-url').value.trim());start();
</script></body></html>
