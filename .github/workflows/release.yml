name: Release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:
concurrency:
  group: mytask-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select tagged release source
        shell: bash
        run: |
          release_tag="v$(cat VERSION)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$release_tag" ]]; then
            echo "Tag does not match VERSION" >&2
            exit 1
          fi
          git show-ref --verify "refs/tags/$release_tag"
          git checkout --detach "$release_tag"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup
      - run: pnpm release:check
      - run: pnpm db:migrate
      - run: pnpm package:release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/releases/* --verify-tag \
            --title "MyTask $RELEASE_TAG" --notes-file CHANGELOG.md
